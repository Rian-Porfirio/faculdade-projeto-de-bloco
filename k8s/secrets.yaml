# ATENCAO: isto e um EXEMPLO para desenvolvimento/apresentacao, com valores de exemplo em texto puro
# apenas para o trabalho ficar executavel. Nunca commitar segredos reais em um Secret assim.
# Em um cenario real: gerar via `kubectl create secret generic ... --from-literal=...`,
# um cofre externo (Vault, AWS Secrets Manager) ou Sealed Secrets/SOPS - nunca em texto no Git.
apiVersion: v1
kind: Secret
metadata:
  name: votacao-secrets
  namespace: votacao
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: postgres
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
  GRAFANA_ADMIN_PASSWORD: admin
