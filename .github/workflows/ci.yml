name: CI — Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  JAVA_VERSION: '21'

jobs:
  build-test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: 🔑 Permissão Gradle
        run: chmod +x gradlew

      - name: 🏗️ Build
        run: ./gradlew build -x test --no-daemon

      - name: 🧪 Testes
        run: ./gradlew test --no-daemon

      - name: 📊 Upload relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 7

      - name: 📝 Summary
        if: always()
        run: |
          echo "## 🧪 CI - Build & Test" >> $GITHUB_STEP_SUMMARY
          echo "Build e testes executados com sucesso." >> $GITHUB_STEP_SUMMARY