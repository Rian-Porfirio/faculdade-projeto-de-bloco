global:
  scrape_interval: 10s

scrape_configs:
  - job_name: voting-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['voting-service:8080']
  - job_name: result-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['result-service:8081']
  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['audit-service:8082']
