server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida cai no index.html (React Router decide)
    location / {
        try_files $uri /index.html;
    }

    # Proxy reverso para os três serviços de backend (nomes = serviços do docker-compose / Kubernetes)
    location /api/ {
        proxy_pass http://voting-service:8080/api/;
        proxy_set_header Host $host;
    }
    location /result-api/ {
        proxy_pass http://result-service:8081/result-api/;
        proxy_set_header Host $host;
    }
    location /audit-api/ {
        proxy_pass http://audit-service:8082/audit-api/;
        proxy_set_header Host $host;
    }
}
