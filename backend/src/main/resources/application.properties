spring.application.name=voting-service
server.port=8080

# Banco de dados (PostgreSQL). Usuario/senha NAO tem valor padrao: vem do ambiente (ou do profile dev).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/votacao}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

# Para o trabalho, o Hibernate cria/atualiza as tabelas automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Dados de demonstracao (so sao inseridos se o banco estiver vazio)
app.seed.enabled=true

# Origens permitidas no CORS (frontend Vite)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html

# ---- Branch 2: mensageria (RabbitMQ) ----
# app.messaging.enabled=false permite rodar o servico sem broker (nenhum evento e publicado).
app.messaging.enabled=true
# Ao iniciar, republica eleicoes/candidatos/votos existentes (seguro: consumidores sao idempotentes).
app.messaging.republish-on-startup=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

# ---- Branch 3: observabilidade ----
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Tracing (OpenTelemetry -> OTLP HTTP -> Jaeger). O contexto tambem e propagado pelo RabbitMQ.
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# Logs padronizados: timestamp, level, service, traceId, eventId, mensagem
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} traceId=%X{traceId:-} eventId=%X{eventId:-} logger=%logger{20} - %msg%n
