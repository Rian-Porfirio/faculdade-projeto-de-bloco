spring.application.name=voting-service
server.port=8080

# Banco de dados (PostgreSQL). Valores padrao servem apenas para desenvolvimento local.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/votacao}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Para o trabalho, o Hibernate cria/atualiza as tabelas automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Dados de demonstracao (so sao inseridos se o banco estiver vazio)
app.seed.enabled=true

# Origens permitidas no CORS (frontend Vite)
app.cors.allowed-origins=http://localhost:5173

springdoc.swagger-ui.path=/swagger-ui.html

# ---- Branch 2: mensageria (RabbitMQ) ----
# app.messaging.enabled=false permite rodar o servico sem broker (nenhum evento e publicado).
app.messaging.enabled=true
# Ao iniciar, republica eleicoes/candidatos/votos existentes (seguro: consumidores sao idempotentes).
app.messaging.republish-on-startup=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
