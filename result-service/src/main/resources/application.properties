spring.application.name=result-service
server.port=8081

# Banco proprio do servico (database-per-service), no mesmo servidor PostgreSQL.
spring.datasource.url=${RESULT_DATABASE_URL:jdbc:postgresql://localhost:5432/resultados}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.messaging.enabled=true
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Tratamento de falhas do consumidor: 3 tentativas (1s, 2s) e depois a mensagem vai para a DLQ.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---- Branch 3: observabilidade ----
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Tracing (OpenTelemetry -> OTLP HTTP -> Jaeger). O contexto tambem e propagado pelo RabbitMQ.
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# Logs padronizados: timestamp, level, service, traceId, eventId, mensagem
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} traceId=%X{traceId:-} eventId=%X{eventId:-} logger=%logger{20} - %msg%n
