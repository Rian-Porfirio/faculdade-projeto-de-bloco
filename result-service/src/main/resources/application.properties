spring.application.name=result-service
server.port=8081

# Banco proprio do servico (database-per-service), no mesmo servidor PostgreSQL.
spring.datasource.url=${RESULT_DATABASE_URL:jdbc:postgresql://localhost:5432/resultados}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.messaging.enabled=true
app.cors.allowed-origins=http://localhost:5173

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Tratamento de falhas do consumidor: 3 tentativas (1s, 2s) e depois a mensagem vai para a DLQ.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
