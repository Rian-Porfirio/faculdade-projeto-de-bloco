# Profile "dev": credenciais LOCAIS de desenvolvimento (valores de exemplo, nao sao segredos reais).
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Em Docker/Kubernetes o profile nao e usado: as credenciais vem de variaveis de ambiente (Secret).
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Sem Jaeger local, desliga o envio de traces para nao poluir o log.
management.tracing.enabled=false
