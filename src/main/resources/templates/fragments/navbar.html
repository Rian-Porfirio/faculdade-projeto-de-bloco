<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark sticky-top" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/products}">
            <div class="brand-icon">
                <i class="bi bi-box-seam-fill"></i>
            </div>
            <span class="brand-name">AgrotelliSystem</span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}"
                       th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('/products')} ? 'active' : ''">
                        <i class="bi bi-grid-3x3-gap me-1"></i>Produtos
                    </a>
                </li>
                <li class="nav-item ms-lg-2">
                    <a class="btn btn-accent" th:href="@{/products/new}" id="btnNewProduct">
                        <i class="bi bi-plus-lg me-1"></i>Novo Produto
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
