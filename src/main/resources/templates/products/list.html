<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Produtos | AgrotelliSystem</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container py-4">

    <!-- Page Header -->
    <div class="page-header d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
            <h1 class="page-title mb-1">Produtos</h1>
            <p class="page-subtitle text-muted mb-0">Gerencie o catálogo de produtos da sua loja</p>
        </div>
        <a th:href="@{/products/new}" class="btn btn-accent d-inline-flex align-items-center gap-2" id="btnNewProduct">
            <i class="bi bi-plus-lg"></i>
            <span>Novo Produto</span>
        </a>
    </div>

    <!-- Filter Card -->
    <div class="filter-card card mb-4">
        <div class="card-body">
            <form id="filterForm"
                  hx-get="/products/table"
                  hx-target="#productTableWrapper"
                  hx-swap="outerHTML"
                  hx-trigger="submit, change from:#categorySelect"
                  hx-indicator="#loadingIndicator"
                  class="row g-3 align-items-end">

                <div class="col-12 col-md-6 col-lg-5">
                    <label for="searchInput" class="form-label fw-semibold">
                        <i class="bi bi-search me-1 text-primary-custom"></i>Buscar produto
                    </label>
                    <div class="input-group">
                        <input type="text"
                               class="form-control"
                               id="searchInput"
                               name="search"
                               placeholder="Nome do produto..."
                               th:value="${search}"
                               autocomplete="off"/>
                        <button class="btn btn-primary-custom" type="submit" id="btnSearch">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>

                <div class="col-12 col-md-4 col-lg-3">
                    <label for="categorySelect" class="form-label fw-semibold">
                        <i class="bi bi-tag me-1 text-primary-custom"></i>Categoria
                    </label>
                    <select class="form-select" id="categorySelect" name="category">
                        <option value="" th:selected="${selectedCategory == null or selectedCategory.empty}">
                            Todas as categorias
                        </option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat}"
                                th:text="${cat}"
                                th:selected="${cat == selectedCategory}">
                            Categoria
                        </option>
                    </select>
                </div>

                <div class="col-12 col-md-2 col-lg-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary-custom flex-fill" id="btnApplyFilter">
                        <i class="bi bi-funnel me-1"></i>Filtrar
                    </button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary" title="Limpar filtros" id="btnClearFilter">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>

                <!-- HTMX loading indicator -->
                <div id="loadingIndicator" class="htmx-indicator col-auto d-flex align-items-center">
                    <div class="spinner-border spinner-border-sm text-primary-custom" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Products Table -->
    <div class="card product-card">
        <div class="card-body p-0">
            <div th:replace="~{fragments/product-table :: productTable}"></div>
        </div>
    </div>

</main>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <div class="modal-icon-wrapper mx-auto mb-2">
                    <div class="delete-icon-circle">
                        <i class="bi bi-exclamation-triangle-fill text-danger"></i>
                    </div>
                </div>
            </div>
            <div class="modal-body text-center pt-0">
                <h5 class="modal-title fw-bold mb-2" id="deleteModalLabel">Confirmar Exclusão</h5>
                <p class="text-muted mb-1">Você está prestes a excluir o produto:</p>
                <p class="fw-semibold text-dark fs-5 mb-3" id="deleteProductName">Nome do Produto</p>
                <p class="text-muted small mb-0">Esta ação não pode ser desfeita.</p>
            </div>
            <div class="modal-footer border-0 justify-content-center gap-3 pb-4">
                <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal" id="btnCancelDelete">
                    <i class="bi bi-x-lg me-1"></i>Cancelar
                </button>
                <form id="deleteForm" method="post" action="/products/0">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit" class="btn btn-danger px-4" id="btnConfirmDelete">
                        <i class="bi bi-trash-fill me-1"></i>Excluir
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
